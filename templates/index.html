<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Automated Sales Report</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 0;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 80px auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    .upload-box {
      margin-top: 24px;
      padding: 24px;
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1f2937;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      font-size: 14px;
      color: #444;
    }

    .error {
      color: #b91c1c;
    }

    .success {
      color: #047857;
    }

    .download-link {
      display: block;
      margin-top: 16px;
      text-align: center;
      padding: 12px;
      background: #ecfdf5;
      color: #047857;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .small {
      margin-top: 18px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Automated Sales Report</h1>

    <p>
      Upload an Excel file and generate an automated PDF sales report with charts,
      metrics and analysis.
    </p>

    <div class="upload-box">
      <form id="reportForm">
        <input
          type="file"
          id="fileInput"
          name="file"
          accept=".xlsx,.xls"
          required
        />

        <button type="submit" id="submitBtn">
          Generate PDF Report
        </button>
      </form>

      <div id="status" class="status"></div>
      <div id="downloadArea"></div>
    </div>

    <p class="small">
      Required Excel columns: Date, Product, Quantity, Price, Seller.
    </p>
  </div>

  <script>
    const form = document.getElementById("reportForm");
    const fileInput = document.getElementById("fileInput");
    const submitBtn = document.getElementById("submitBtn");
    const statusDiv = document.getElementById("status");
    const downloadArea = document.getElementById("downloadArea");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const file = fileInput.files[0];

      if (!file) {
        statusDiv.textContent = "Please select an Excel file.";
        statusDiv.className = "status error";
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      submitBtn.disabled = true;
      submitBtn.textContent = "Generating...";
      statusDiv.textContent = "Generating report, please wait...";
      statusDiv.className = "status";
      downloadArea.innerHTML = "";

      try {
        const response = await fetch("/generate-report", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || "Failed to generate report.");
        }

        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = downloadUrl;
        link.download = "sales_report.pdf";
        link.textContent = "Download PDF Report";
        link.className = "download-link";

        downloadArea.appendChild(link);

        statusDiv.textContent = "Report generated successfully.";
        statusDiv.className = "status success";

      } catch (error) {
        statusDiv.textContent = error.message;
        statusDiv.className = "status error";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Generate PDF Report";
      }
    });
  </script>
</body>
</html>
